---
name: Repository Protection Check

# This workflow helps enforce repository protection policies
'on':
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  validate-push:
    runs-on: ubuntu-latest
    name: Validate Repository Changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check for unauthorized changes
        run: |
          echo "::notice::Validating repository changes"

          # Get the actor (person who triggered this workflow)
          ACTOR="${{ github.actor }}"
          OWNER="Hawaiipotato"

          echo "Actor: $ACTOR"
          echo "Owner: $OWNER"

          # Check if the actor is the repository owner
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::warning::Changes by someone other than owner ($OWNER)"
            echo "::warning::Please ensure proper authorization"

            # In a real scenario, you might want to fail here:
            # echo "::error::Unauthorized push detected"
            # exit 1
          else
            echo "::notice::Changes are from the repository owner"
          fi

      - name: Validate critical files
        run: |
          echo "::notice::Checking for changes to critical files"

          # List changed files
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            SHA="${{ github.sha }}"
            CHANGED_FILES=$(git diff --name-only $BASE $SHA)
          else
            CHANGED_FILES=$(git diff --name-only HEAD^ HEAD || echo "")
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check for changes to critical files
          CRITICAL_FILES=(
            ".github/CODEOWNERS"
            ".github/workflows"
            "package.json"
            "server.js"
            "index.html"
          )

          for file in "${CRITICAL_FILES[@]}"; do
            # Use grep with beginning anchor to avoid false positives
            if echo "$CHANGED_FILES" | grep -q "^$file\|/$file"; then
              echo "::warning::Critical file modified: $file"
            fi
          done
