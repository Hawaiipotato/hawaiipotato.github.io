<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>土豆的小站</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    <link rel="stylesheet" href="https://chinese-font.netlify.app/packages/dyslytxk/dist/SlideYouran-Regular2_0/result.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        @font-face {
            font-family: 'FZShengKai';
            src: url('/fonts/fzshengkai-cu.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'FZShengKaiZhun';
            src: url('/fonts/fzshengkai-zhun.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        .welcome-page {
            height: calc(100vh - 70px);
            min-height: calc(100vh - 70px);
            width: 100%;
            background-image: url('/images/background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            font-family: 'STXinwei', 'STKaiti', 'KaiTi', '楷体', 'serif';
            overflow: hidden;
        }
        .welcome-page::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.2);
        }
        .welcome-content {
            position: relative;
            z-index: 1;
            padding: 20px;
            max-width: 90%;
        }
        .welcome-content h1 {
            font-size: 3.2rem;
            margin-bottom: 20px;
            color: #ffffaf;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6), 0 4px 20px rgba(0,0,0,0.4);
            letter-spacing: 8px;
            line-height: 1.6;
            font-weight: 400;
            font-family: 'FZShengKai', 'STXingkai', '华文行楷', 'KaiTi', serif;
        }
        .welcome-content p {
            font-size: 1.4rem;
            color: #e6e68a;
            text-shadow: 0 1px 6px rgba(0,0,0,0.6), 0 2px 12px rgba(0,0,0,0.4);
            letter-spacing: 4px;
            font-family: 'FZShengKaiZhun', 'LXGW WenKai', 'STKaiti', 'KaiTi', serif;
            font-weight: 400;
        }
        @media (max-width: 768px) {
            .welcome-page { height: calc(100vh - 60px); min-height: calc(100vh - 60px); }
            .welcome-content h1 { font-size: 1.8rem; letter-spacing: 3px; }
            .welcome-content p { font-size: 1rem; letter-spacing: 2px; }
        }
        @media (max-width: 480px) {
            .welcome-content h1 { font-size: 1.5rem; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <nav class="top-nav">
        <a href="/" class="nav-brand">土豆的小站</a>
        <div class="nav-center">
            <a href="/" class="nav-link active">首页</a>
            <a href="/about" class="nav-link">关于我</a>
            <a href="/blog/" class="nav-link">博客</a>
            <a href="/partner" class="nav-link">合作伙伴</a>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <svg class="theme-icon sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <div class="theme-slider"></div>
                <svg class="theme-icon moon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <a href="https://github.com/Hawaiipotato" target="_blank" class="github-link" aria-label="GitHub">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="welcome-page">
            <div class="welcome-content">
                <h1>休对故人思故国 且将新火试新茶 诗酒趁年华</h1>
                <p>————苏轼《望江南·超然台作》</p>
            </div>
        </div>
    </main>

    <script>
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        })();
    </script>
</body>
</html>
