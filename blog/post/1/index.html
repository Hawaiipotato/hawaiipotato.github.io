    <script>
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            const hljsLight = document.getElementById('hljs-light');
            const hljsDark = document.getElementById('hljs-dark');
            
            function updateHighlightTheme() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                hljsLight.disabled = isDark;
                hljsDark.disabled = !isDark;
            }
            
            updateHighlightTheme();
            
            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateHighlightTheme();
            });
        })();

        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('readingProgress').style.width = scrolled + '%';
        });

        // 渲染 Markdown
        const mdContent = "\n> 这是我用纯前端技术搭建的个人博客，支持 Markdown 写作。\n\n## 为什么要写博客？\n\n写博客是一个很好的习惯，它可以帮助我：\n\n- **整理思路** - 把学到的知识用自己的话写出来\n- **记录成长** - 回头看自己之前的文章，能看到进步\n- **分享交流** - 也许能帮助到其他人\n\n## 这个博客的技术栈\n\n这个博客完全基于静态文件，使用以下技术：\n\n1. **HTML/CSS/JavaScript** - 纯原生实现\n2. **Marked.js** - 用于 Markdown 渲染\n3. **Highlight.js** - 代码高亮\n4. **GitHub Pages** - 免费托管\n\n## 写作流程\n\n发布一篇新文章只需要两步：\n\n### 第一步：编写 Markdown 文件\n\n把写好的 `.md` 文件放到 `blog/posts/` 目录下，文件名和文章 ID 对应。\n\n### 第二步：更新元数据\n\n在 `data/posts.json` 中添加文章信息：\n\n```json\n{\n  \"id\": \"文章ID\",\n  \"title\": \"文章标题\",\n  \"date\": \"2026-02-11\",\n  \"author\": \"作者名\",\n  \"tags\": [\"标签1\", \"标签2\"],\n  \"summary\": \"文章摘要\"\n}\n```\n\n## 未来的计划\n\n接下来我打算写这些主题：\n\n- Python 爬虫实战\n- Windows 调试技巧\n- 一些有趣的小脚本\n\n希望这个博客能持续更新下去！\n\n---\n\n*最后更新：2026年2月11日*\n";
        marked.setOptions({ breaks: true, gfm: true, headerIds: true, mangle: false });
        document.getElementById('postContent').innerHTML = marked.parse(mdContent);
        document.querySelectorAll('pre code').forEach((block) => {
            hljs.highlightElement(block);
        });

        // 加载文章导航
        fetch('/data/posts.json')
            .then(r => r.json())
            .then(data => {
                const posts = data.posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                const currentId = '1';
                const currentIndex = posts.findIndex(p => p.id === currentId);
                const prevPost = posts[currentIndex + 1];
                const nextPost = posts[currentIndex - 1];
                
                if (!prevPost && !nextPost) return;
                
                let navHtml = '<div class="post-nav-inner">';
                
                if (prevPost) {
                    navHtml += '<a href="/blog/post/' + prevPost.id + '/" class="post-nav-link">' +
                        '<span class="post-nav-label">← 上一篇</span>' +
                        '<span class="post-nav-title">' + escapeHtml(prevPost.title) + '</span></a>';
                } else {
                    navHtml += '<div></div>';
                }
                
                if (nextPost) {
                    navHtml += '<a href="/blog/post/' + nextPost.id + '/" class="post-nav-link post-nav-next">' +
                        '<span class="post-nav-label">下一篇 →</span>' +
                        '<span class="post-nav-title">' + escapeHtml(nextPost.title) + '</span></a>';
                }
                
                navHtml += '</div>';
                document.getElementById('postNav').innerHTML = navHtml;
            });

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
