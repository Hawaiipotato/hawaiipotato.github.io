<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客 - 土豆的小站</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/blog/css/blog.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    <style>
        a, a:link, a:visited, a:hover, a:active {
            text-decoration: none;
        }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <nav class="top-nav">
        <a href="/" class="nav-brand">土豆的小站</a>
        
        <div class="nav-center">
            <a href="/" class="nav-link">首页</a>
            <a href="/#about" class="nav-link">关于我</a>
            <a href="/blog/" class="nav-link active">博客</a>
            <a href="/#partner" class="nav-link">合作伙伴</a>
        </div>
        
        <div class="nav-right">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <svg class="theme-icon sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <div class="theme-slider"></div>
                <svg class="theme-icon moon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            
            <a href="https://github.com/Hawaiipotato" target="_blank" class="github-link" aria-label="GitHub">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="blog-header">
            <h1 class="blog-title">技术随笔</h1>
            <p class="blog-subtitle">记录学习与思考的痕迹</p>
        </div>

        <div class="tags-filter" id="tagsFilter">
            <span class="tag active" data-tag="all">全部</span>
        </div>

        <div class="posts-container" id="postsContainer">
            <div class="loading">加载中...</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>土豆的小站</h4>
                    <p>一个开发者的个人空间，记录技术与生活的点滴。</p>
                </div>
                <div class="footer-section">
                    <h4>快速链接</h4>
                    <ul>
                        <li><a href="/">首页</a></li>
                        <li><a href="/blog/">博客</a></li>
                        <li><a href="/#about">关于我</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>联系方式</h4>
                    <ul>
                        <li><a href="https://github.com/Hawaiipotato" target="_blank">GitHub</a></li>
                        <li><a href="mailto:hawaiipotatoes@gmail.com">邮箱</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 土豆的小站 · Made with &#10084;&#65039; · All rights reserved</p>
            </div>
        </div>
    </footer>

    <script>
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            
            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        })();

        let allPosts = [];
        let allTags = new Set();

        async function loadPosts() {
            try {
                const response = await fetch('/data/posts.json');
                const data = await response.json();
                allPosts = data.posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                allPosts.forEach(post => {
                    if (post.tags) {
                        post.tags.forEach(tag => allTags.add(tag));
                    }
                });
                
                renderTags();
                renderPosts(allPosts);
            } catch (error) {
                console.error('加载文章列表失败:', error);
                document.getElementById('postsContainer').innerHTML = 
                    '<div class="error">加载文章列表失败<br><small style="font-size: 0.8rem; opacity: 0.7;">' + error.message + '</small></div>';
            }
        }

        function renderTags() {
            const container = document.getElementById('tagsFilter');
            const tags = Array.from(allTags).sort();
            
            tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = 'tag';
                span.dataset.tag = tag;
                span.textContent = tag;
                span.onclick = () => filterByTag(tag);
                container.appendChild(span);
            });
        }

        function renderPosts(posts) {
            const container = document.getElementById('postsContainer');
            
            if (posts.length === 0) {
                container.innerHTML = '<div class="empty">暂无文章</div>';
                return;
            }
            
            container.innerHTML = posts.map(post => `
                <article class="post-card-item" onclick="location.href='/blog/post/${post.id}/'">
                    <h2 class="post-card-title">${post.title}</h2>
                    <div class="post-card-meta">
                        <span class="post-date">${formatDate(post.date)}</span>
                        <span class="post-author">${post.author}</span>
                    </div>
                    <p class="post-card-summary">${post.summary || '暂无摘要'}</p>
                    <div class="post-card-tags">
                        ${(post.tags || []).map(tag => `<span class="post-card-tag">${tag}</span>`).join('')}
                    </div>
                </article>
            `).join('');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        }

        function filterByTag(tag) {
            document.querySelectorAll('.tag').forEach(t => {
                t.classList.toggle('active', t.dataset.tag === tag);
            });
            
            if (tag === 'all') {
                renderPosts(allPosts);
            } else {
                const filtered = allPosts.filter(post => 
                    post.tags && post.tags.includes(tag)
                );
                renderPosts(filtered);
            }
        }

        document.querySelector('[data-tag="all"]').onclick = () => filterByTag('all');

        loadPosts();
    </script>
</body>
</html>
