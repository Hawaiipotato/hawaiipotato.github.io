<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - 土豆的小站</title>
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <link rel="stylesheet" href="../css/style.css">
    <!-- Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 中文字体 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <!-- 顶部导航栏 - 与主页一致 -->
    <nav class="top-nav">
        <a href="/" class="nav-brand">土豆的小站</a>
        <div class="nav-center">
            <a href="/" class="nav-link">首页</a>
            <a href="/about.html" class="nav-link">关于我</a>
            <a href="/blog.html" class="nav-link active">博客</a>
            <a href="/partner.html" class="nav-link">合作伙伴</a>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <svg class="theme-icon sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <div class="theme-slider"></div>
                <svg class="theme-icon moon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <a href="https://github.com/Hawaiipotato" target="_blank" class="github-link" aria-label="GitHub">
                <svg viewBox="0 0 16 16" aria-hidden="true">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
        </div>
    </nav>

    <!-- 阅读进度条 -->
    <div class="reading-progress" id="readingProgress"></div>

    <!-- 主内容 -->
    <main class="post-page">
        <div class="post-wrapper">
            <!-- 文章头部卡片 -->
            <div class="post-card" id="postHeader">
                <div class="loading">加载中...</div>
            </div>
            
            <!-- 文章内容 -->
            <div class="post-content markdown-body" id="postContent"></div>
            
            <!-- 文章导航 -->
            <div class="post-nav" id="postNav"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h4>土豆的小站</h4>
                    <p>一个开发者的个人空间，记录技术与生活的点滴。</p>
                </div>
                <div class="footer-section">
                    <h4>快速链接</h4>
                    <ul>
                        <li><a href="/">首页</a></li>
                        <li><a href="/about.html">关于我</a></li>
                        <li><a href="/blog.html">博客</a></li>
                        <li><a href="/partner.html">合作伙伴</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>联系方式</h4>
                    <ul>
                        <li><a href="https://github.com/Hawaiipotato" target="_blank">GitHub</a></li>
                        <li><a href="mailto:hawaiipotatoes@gmail.com">邮箱</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 土豆的小站 · Made with ❤️ · All rights reserved</p>
            </div>
        </div>
    </footer>

    <script>
        // 主题切换
        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            const hljsLight = document.getElementById('hljs-light');
            const hljsDark = document.getElementById('hljs-dark');
            
            function updateHighlightTheme() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                hljsLight.disabled = isDark;
                hljsDark.disabled = !isDark;
            }
            
            updateHighlightTheme();
            
            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateHighlightTheme();
            });
        })();

        // 阅读进度条
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('readingProgress').style.width = scrolled + '%';
        });

        // 获取文章ID
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        let allPosts = [];

        // 加载文章
        async function loadPost() {
            if (!postId) {
                document.getElementById('postHeader').innerHTML = '<div class="error">文章ID不能为空</div>';
                return;
            }

            try {
                const metaResponse = await fetch('../data/posts.json');
                const metaData = await metaResponse.json();
                allPosts = metaData.posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                const post = allPosts.find(p => p.id === postId);
                
                if (!post) {
                    document.getElementById('postHeader').innerHTML = '<div class="error">文章不存在</div>';
                    return;
                }

                const mdResponse = await fetch(`./posts/${encodeURIComponent(post.file)}`);
                if (!mdResponse.ok) throw new Error('Failed to load markdown');
                const mdContent = await mdResponse.text();

                renderHeader(post);
                renderContent(mdContent);
                renderNav();
                
                document.title = `${post.title} - 土豆的小站`;
                
            } catch (error) {
                document.getElementById('postHeader').innerHTML = '<div class="error">加载失败</div>';
            }
        }

        // 渲染文章头部
        function renderHeader(post) {
            document.getElementById('postHeader').innerHTML = `
                <h1 class="post-title">${post.title}</h1>
                <div class="post-meta">
                    <span class="post-date">${formatDate(post.date)}</span>
                    <span class="post-author">${post.author}</span>
                </div>
                <div class="post-tags">
                    ${(post.tags || []).map(tag => `<span class="post-tag">${tag}</span>`).join('')}
                </div>
            `;
        }

        // 渲染Markdown
        function renderContent(mdContent) {
            marked.setOptions({
                breaks: true,
                gfm: true,
                headerIds: true,
                mangle: false
            });
            
            const html = marked.parse(mdContent);
            document.getElementById('postContent').innerHTML = html;
            
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        // 渲染导航
        function renderNav() {
            const currentIndex = allPosts.findIndex(p => p.id === postId);
            const prevPost = allPosts[currentIndex + 1];
            const nextPost = allPosts[currentIndex - 1];
            
            if (!prevPost && !nextPost) return;
            
            let navHtml = '<div class="post-nav-inner">';
            
            if (prevPost) {
                navHtml += `
                    <a href="./post.html?id=${prevPost.id}" class="post-nav-link">
                        <span class="post-nav-label">← 上一篇</span>
                        <span class="post-nav-title">${prevPost.title}</span>
                    </a>
                `;
            } else {
                navHtml += '<div></div>';
            }
            
            if (nextPost) {
                navHtml += `
                    <a href="./post.html?id=${nextPost.id}" class="post-nav-link post-nav-next">
                        <span class="post-nav-label">下一篇 →</span>
                        <span class="post-nav-title">${nextPost.title}</span>
                    </a>
                `;
            }
            
            navHtml += '</div>';
            document.getElementById('postNav').innerHTML = navHtml;
        }

        // 格式化日期
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
        }

        // 初始化
        loadPost();
    </script>
</body>
</html>
