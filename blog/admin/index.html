<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理 - 土豆的小站</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/blog/css/blog.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
    <script src="https://cdn.jsdelivr.net/npm/blueimp-md5@2.19.0/js/md5.min.js"></script>
    <style>
        a, a:link, a:visited, a:hover, a:active { text-decoration: none; }
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 90px 20px 60px; }
        .admin-header { text-align: center; margin-bottom: 40px; }
        .admin-header h1 {
            font-size: 2rem; margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            font-family: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .admin-header p { color: var(--text-secondary); }
        
        .login-container {
            max-width: 400px; margin: 100px auto; padding: 40px;
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
        }
        .login-container h1 { text-align: center; margin-bottom: 30px; font-size: 1.5rem; }
        .login-error { color: #ef4444; text-align: center; margin-bottom: 16px; display: none; }
        
        .form-section {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 30px; margin-bottom: 24px;
        }
        .form-section h2 {
            font-size: 1.2rem; margin-bottom: 20px; color: var(--text-primary);
            font-family: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary);
            font-family: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .form-group label .required { color: #ef4444; margin-left: 4px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 16px; background: var(--bg-glass);
            border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem;
            color: var(--text-primary);
            font-family: 'LXGW WenKai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            transition: all 0.2s ease;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none; border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        .form-group textarea { min-height: 400px; resize: vertical; line-height: 1.8; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .hint { font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px; }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white; border: none; padding: 14px 32px; font-size: 1rem;
            border-radius: 8px; cursor: pointer; font-weight: 500; transition: all 0.2s ease;
            font-family: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: var(--bg-glass); color: var(--text-primary);
            border: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.9rem;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease; margin-left: 10px;
            font-family: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .btn-secondary:hover { background: var(--bg-glass-hover); border-color: var(--accent-primary); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.1); color: #ef4444;
            border: 1px solid #ef4444; padding: 10px 20px; font-size: 0.9rem;
            border-radius: 8px; cursor: pointer; transition: all 0.2s ease;
            font-family: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .btn-danger:hover { background: #ef4444; color: white; }
        .action-buttons { text-align: center; margin-top: 30px; }
        .status-box {
            padding: 16px 20px; border-radius: 12px; margin-top: 20px;
            font-family: 'LXGW WenKai', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            white-space: pre-wrap;
        }
        .status-success { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; }
        .status-error { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #ef4444; }
        
        .post-list {
            background: var(--bg-glass); border: 1px solid var(--border-color);
            border-radius: 12px; margin-bottom: 30px; max-height: 300px; overflow-y: auto;
        }
        .post-list-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid var(--border-color);
            cursor: pointer; transition: background 0.2s;
        }
        .post-list-item:last-child { border-bottom: none; }
        .post-list-item:hover { background: var(--bg-glass-hover); }
        .post-list-item.active { background: rgba(99, 102, 241, 0.1); border-left: 3px solid var(--accent-primary); }
        .post-list-item .post-title { font-weight: 500; }
        .post-list-item .post-date { color: var(--text-secondary); font-size: 0.85rem; }
        .post-list-header {
            padding: 16px; border-bottom: 1px solid var(--border-color);
            font-weight: 500; display: flex; justify-content: space-between; align-items: center;
        }
        
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .admin-container { padding: 80px 16px 40px; }
        }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <nav class="top-nav" style="justify-content: space-between;">
        <a href="/blog/" class="nav-link" style="margin: 0; padding: 10px 16px;">← 返回博客</a>
        <div class="nav-right">
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <svg class="theme-icon sun" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <div class="theme-slider"></div>
                <svg class="theme-icon moon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main-content">
        <div id="loginPage" class="login-container" style="display: none;">
            <h1>🔐 身份验证</h1>
            <div id="loginError" class="login-error"></div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="请输入管理密码" onkeypress="if(event.key==='Enter')doLogin()">
            </div>
            <div class="form-group">
                <label><input type="checkbox" id="rememberMe"> 记住我</label>
            </div>
            <button class="btn-primary" style="width: 100%;" onclick="doLogin()">登录</button>
        </div>

        <div id="adminPage" class="admin-container" style="display: none;">
            <div class="admin-header">
                <h1>文章管理</h1>
                <p>发布、编辑或删除博客文章</p>
            </div>

            <div class="post-list">
                <div class="post-list-header">
                    <span>已有文章</span>
                    <button class="btn-secondary" style="margin: 0; padding: 6px 12px; font-size: 0.8rem;" onclick="newPost()">+ 新建</button>
                </div>
                <div id="postListItems"></div>
            </div>

            <form id="publishForm">
                <div class="form-section">
                    <h2>文章信息</h2>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>文章 ID <span class="required">*</span></label>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" id="postId" placeholder="数字 ID" required style="flex: 1;">
                                <button type="button" class="btn-secondary" onclick="generateNextId()" style="margin: 0; white-space: nowrap;">自动生成</button>
                            </div>
                            <div class="hint">URL 将是 /blog/post/{ID}/</div>
                        </div>
                        <div class="form-group">
                            <label>发布日期 <span class="required">*</span></label>
                            <input type="date" id="postDate" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>文章标题 <span class="required">*</span></label>
                        <input type="text" id="postTitle" placeholder="请输入文章标题" required>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>作者 <span class="required">*</span></label>
                            <input type="text" id="postAuthor" value="Potato" required>
                        </div>
                        <div class="form-group">
                            <label>标签</label>
                            <input type="text" id="postTags" placeholder="Python, 教程（逗号分隔）">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>摘要 <span class="required">*</span></label>
                        <input type="text" id="postSummary" placeholder="简短描述文章内容" required>
                    </div>
                </div>
                
                <div class="form-section">
                    <h2>Markdown 正文</h2>
                    <div class="form-group">
                        <textarea id="postContent" placeholder="在这里粘贴或编写 Markdown 内容...

## 标题

- 列表项

```python
print('Hello World')
```"></textarea>
                    </div>
                </div>
                
                <div class="action-buttons">
                    <button type="submit" class="btn-primary" id="publishBtn">发布</button>
                    <button type="button" class="btn-secondary" onclick="fillDemo()">填入示例</button>
                    <button type="button" class="btn-secondary" onclick="clearForm()">清空</button>
                    <button type="button" class="btn-danger" id="deleteBtn" style="display: none;" onclick="deletePost()">删除</button>
                </div>
                
                <div id="statusBox" class="status-box" style="display: none;"></div>
            </form>
        </div>
    </main>

    <script>
        const AUTH_SALT = 'hawaii_potato_2024_salt';
        let token = localStorage.getItem('adminToken');
        let posts = [];
        let editingPostId = null;

        function hashPassword(password) {
            return md5(password + AUTH_SALT);
        }

        async function api(url, options = {}) {
            options.headers = options.headers || {};
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            const res = await fetch(url, options);
            return res;
        }

        async function checkAuth() {
            if (!token) return false;
            try {
                const res = await api('/api/check-auth');
                const data = await res.json();
                return data.authenticated;
            } catch {
                return false;
            }
        }

        async function doLogin() {
            const password = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;
            const errorDiv = document.getElementById('loginError');
            
            if (!password) {
                errorDiv.textContent = '请输入密码';
                errorDiv.style.display = 'block';
                return;
            }

            const passwordHash = hashPassword(password);
            
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ passwordHash })
                });
                const data = await res.json();
                
                if (data.success) {
                    token = data.token;
                    if (remember) {
                        localStorage.setItem('adminToken', token);
                    }
                    showAdmin();
                } else {
                    errorDiv.textContent = data.error || '登录失败';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = '无法连接服务器，请确保已运行 npm start';
                errorDiv.style.display = 'block';
            }
        }

        function showLogin() {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('adminPage').style.display = 'none';
        }

        async function showAdmin() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            await loadPosts();
            generateNextId();
        }

        async function loadPosts() {
            try {
                const res = await api('/api/posts');
                const data = await res.json();
                posts = data.posts || [];
                renderPostList();
            } catch (err) {
                console.error('加载文章列表失败', err);
            }
        }

        function renderPostList() {
            const container = document.getElementById('postListItems');
            container.innerHTML = posts.map(post => `
                <div class="post-list-item ${editingPostId === post.id ? 'active' : ''}" onclick="editPost('${post.id}')">
                    <span class="post-title">${escapeHtml(post.title)}</span>
                    <span class="post-date">${post.date}</span>
                </div>
            `).join('');
        }

        async function editPost(id) {
            try {
                const res = await api(`/api/posts/${id}`);
                const post = await res.json();
                
                editingPostId = id;
                document.getElementById('postId').value = post.id;
                document.getElementById('postTitle').value = post.title;
                document.getElementById('postDate').value = post.date;
                document.getElementById('postAuthor').value = post.author;
                document.getElementById('postTags').value = (post.tags || []).join(', ');
                document.getElementById('postSummary').value = post.summary;
                
                const contentMatch = post.rawContent.match(/^---\n[\s\S]*?\n---\n([\s\S]*)$/);
                document.getElementById('postContent').value = contentMatch ? contentMatch[1] : post.rawContent;
                
                document.getElementById('publishBtn').textContent = '更新';
                document.getElementById('deleteBtn').style.display = 'inline-block';
                renderPostList();
                showStatus(`正在编辑: ${post.title}`, 'success');
            } catch (err) {
                showStatus('加载文章失败', 'error');
            }
        }

        function newPost() {
            editingPostId = null;
            document.getElementById('publishForm').reset();
            document.getElementById('postDate').valueAsDate = new Date();
            document.getElementById('postAuthor').value = 'Potato';
            document.getElementById('publishBtn').textContent = '发布';
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('statusBox').style.display = 'none';
            generateNextId();
            renderPostList();
        }

        async function generateNextId() {
            let maxId = 0;
            posts.forEach(post => {
                const idNum = parseInt(post.id);
                if (!isNaN(idNum) && idNum > maxId) maxId = idNum;
            });
            document.getElementById('postId').value = maxId + 1;
        }
        
        function generateFilename(title) {
            if (!title) return '';
            const isChinese = (c) => /[\u4e00-\u9fa5]/.test(c);
            const isAlphaNum = (c) => /[a-zA-Z0-9]/.test(c);
            let result = '';
            for (let i = 0; i < title.length; i++) {
                const c = title[i];
                if (/\s/.test(c)) {
                    const prev = title[i-1], next = title[i+1];
                    if (prev && next && ((isChinese(prev) && isAlphaNum(next)) || (isAlphaNum(prev) && isChinese(next)))) continue;
                    result += '-';
                } else {
                    result += c;
                }
            }
            result = result.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            return result;
        }

        document.getElementById('publishForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const id = document.getElementById('postId').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const date = document.getElementById('postDate').value;
            const author = document.getElementById('postAuthor').value.trim();
            const tagsInput = document.getElementById('postTags').value.trim();
            const summary = document.getElementById('postSummary').value.trim();
            const content = document.getElementById('postContent').value;
            
            if (!id || !title || !date || !author || !summary || !content) {
                showStatus('请填写所有必填字段', 'error');
                return;
            }
            
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()).filter(t => t) : [];
            const filename = generateFilename(title) || id;
            
            const btn = document.getElementById('publishBtn');
            const isEdit = editingPostId !== null;
            btn.disabled = true;
            btn.textContent = isEdit ? '更新中...' : '发布中...';
            
            try {
                if (isEdit && editingPostId !== id) {
                    const deleteRes = await api(`/api/posts/${editingPostId}`, { method: 'DELETE' });
                    if (!deleteRes.ok) {
                        showStatus('删除旧文章失败', 'error');
                        return;
                    }
                }

                const response = await api('/api/publish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, title, date, author, tags, summary, content, filename })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showStatus(`${isEdit ? '更新' : '发布'}成功！\n\n请 git commit 并 push 到 GitHub`, 'success');
                    await loadPosts();
                    newPost();
                } else {
                    showStatus(`${isEdit ? '更新' : '发布'}失败: ${result.error}`, 'error');
                }
            } catch (error) {
                showStatus('无法连接服务器，请确保已运行 npm start', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '发布';
            }
        });

        async function deletePost() {
            if (!editingPostId) return;
            if (!confirm('确定删除这篇文章？此操作不可恢复！')) return;
            
            try {
                const res = await api(`/api/posts/${editingPostId}`, { method: 'DELETE' });
                const data = await res.json();
                
                if (data.success) {
                    showStatus('文章已删除\n\n请 git commit 并 push 到 GitHub', 'success');
                    await loadPosts();
                    newPost();
                } else {
                    showStatus('删除失败: ' + data.error, 'error');
                }
            } catch (err) {
                showStatus('删除失败', 'error');
            }
        }
        
        function showStatus(message, type) {
            const box = document.getElementById('statusBox');
            box.style.display = 'block';
            box.className = `status-box status-${type}`;
            box.textContent = message;
            box.scrollIntoView({ behavior: 'smooth' });
        }
        
        function fillDemo() {
            generateNextId();
            document.getElementById('postTitle').value = '示例文章标题';
            document.getElementById('postTags').value = '示例, 测试';
            document.getElementById('postSummary').value = '这是一篇示例文章的摘要。';
            document.getElementById('postContent').value = `## 简介

这是一段示例内容。

## 代码示例

\`\`\`python
def hello():
    print("Hello, World!")
\`\`\`

## 总结

开始写作吧！`;
        }
        
        function clearForm() {
            if (confirm('确定清空？')) {
                newPost();
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        (function() {
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;
            themeToggle.addEventListener('click', function() {
                const currentTheme = html.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
            });
        })();

        (async function init() {
            document.getElementById('postDate').valueAsDate = new Date();
            const authenticated = await checkAuth();
            if (authenticated) {
                showAdmin();
            } else {
                showLogin();
            }
        })();
    </script>
</body>
</html>
