# ============================================
# PAGE TEMPLATES
# ============================================
page_templates:
  friends_column: 2            # 2 columns for friends page
  tags_style: blur             # blur or cloud

# ============================================
# CDN
# ============================================
cdn:
  enable: false
  provider: npmmirror
  custom_url: 

# ============================================
# DEVELOPER MODE
# ============================================
developer:
  enable: false
